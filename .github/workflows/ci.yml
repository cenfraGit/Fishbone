name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Fishbone.slnx

      - name: Build
        run: dotnet build Fishbone.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Fishbone.slnx --configuration Release --no-build --verbosity minimal

      # packing on one os only, so a tag does not produce two of every package
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Fishbone.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg