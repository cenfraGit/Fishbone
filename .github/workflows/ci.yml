name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # the projects target net8.0, so its runtime has to be there to run the tests
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # OpenCvSharp's linux-x64 native build links against the GTK3 stack. installing
      # libgtk-3-0 pulls in atk, cairo, pango, harfbuzz and gdk-pixbuf with it, so this
      # one package covers every dependency libOpenCvSharpExtern.so declares
      - name: Install native OpenCV dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0

      - name: Restore
        run: dotnet restore Fishbone.slnx

      - name: Build
        run: dotnet build Fishbone.slnx --configuration Release --no-restore

      - name: Test
        # a hung test fails the run after two minutes instead of holding the job for hours
        run: dotnet test Fishbone.slnx --configuration Release --no-build --verbosity minimal --blame-hang-timeout 2m